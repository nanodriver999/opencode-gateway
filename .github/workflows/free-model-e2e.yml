name: Alternative free-model E2E (anonymous)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_MODEL: opencode/big-pickle
      OPENCODE_MODE: managed
      GATEWAY_HOST: 127.0.0.1
      OPENCODE_PROVIDER: opencode
      OPENCODE_MODEL: big-pickle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm install --global opencode-ai
      - name: Configure local gateway credential
        run: |
          echo "GATEWAY_API_KEY=$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")" >> "$GITHUB_ENV"
      - name: Start gateway without OpenCode login
        run: |
          npm run build
          node dist/index.js >gateway.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS -H "Authorization: Bearer $GATEWAY_API_KEY" http://127.0.0.1:3000/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Gateway did not become ready"
          exit 1
      - name: Compare correct anonymous Zen endpoint responses
        run: node scripts/probe-free-provider.mjs
      - name: Probe anonymous OpenCode Zen (diagnostic only)
        continue-on-error: true
        run: node scripts/probe-anonymous-zen.mjs
      - name: Try alternative free models via OpenAI SDK
        run: node scripts/e2e-free-model.mjs
      - name: Report operational diagnostics on failure
        if: failure()
        run: |
          echo "Gateway readiness / network / provider issue occurred."
          if test -f gateway.log; then tail -n 80 gateway.log; fi
