name: Experimental live LangChain Muse integration
on:
  push:
    branches: [test/32-live-langchain-isolated]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm install -g opencode-ai
          python -m pip install "langchain-openai>=0.3,<2"
      - name: Start disposable OpenCode server
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/isolated"
          printf 'DO_NOT_MODIFY\n' > "$RUNNER_TEMP/isolated/protected.txt"
          cd "$RUNNER_TEMP/isolated"
          opencode serve --hostname 127.0.0.1 --port 4096 </dev/null > "$RUNNER_TEMP/opencode.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl --max-time 2 -fsS http://127.0.0.1:4096/global/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -n 60 "$RUNNER_TEMP/opencode.log"
          exit 1
      - name: Start experimental decision bridge
        run: |
          node scripts/live-langchain-isolated-bridge.mjs >"$RUNNER_TEMP/bridge.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:3099/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/bridge.log"
          exit 1
      - name: Python LangChain full function-call cycle
        run: python scripts/langchain-tool-contract.py
      - name: Assert no local mutation
        if: always()
        run: |
          test "$(cat "$RUNNER_TEMP/isolated/protected.txt")" = DO_NOT_MODIFY
          test ! -e "$RUNNER_TEMP/isolated/forbidden-output.txt"
      - name: Diagnostics
        if: failure()
        run: |
          tail -n 70 "$RUNNER_TEMP/opencode.log" || true
          tail -n 70 "$RUNNER_TEMP/bridge.log" || true
