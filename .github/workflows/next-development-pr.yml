name: Next development PR
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to implement (3-7)"
        required: true
        type: choice
        options: ["3", "4", "5", "6", "7"]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: next-development-pr
  cancel-in-progress: false
jobs:
  next:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feat/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select next stage
        id: stage
        env:
          EVENT: ${{ github.event_name }}
          INPUT_STAGE: ${{ inputs.stage }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then stage="$INPUT_STAGE"
          else
            case "$HEAD_BRANCH" in
              feat/01-* ) stage=2 ;;
              feat/02-* ) stage=3 ;;
              feat/03-* ) stage=4 ;;
              feat/04-* ) stage=5 ;;
              feat/05-* ) stage=6 ;;
              feat/06-* ) stage=7 ;;
              feat/07-* ) echo "All stages complete"; exit 0 ;;
              * ) echo "Unknown stage branch: $HEAD_BRANCH" >&2; exit 1 ;;
            esac
          fi
          case "$stage" in
            3) title="SSE streaming and models endpoint" ;;
            4) title="Security and reliability" ;;
            5) title="Advanced OpenAI compatibility" ;;
            6) title="Docker and integration examples" ;;
            7) title="OpenClaw integration" ;;
            *) echo "Unsupported stage: $stage" >&2; exit 1 ;;
          esac
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "branch=feat/0$stage-auto" >> "$GITHUB_OUTPUT"
      - name: Check required coding-agent credential
        if: steps.stage.outputs.stage != ''
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Set repository Actions secret OPENAI_API_KEY to enable automated development."
            exit 1
          fi
      - name: Install dependencies
        if: steps.stage.outputs.stage != ''
        run: npm install --no-audit --no-fund
      - name: Generate next implementation with Codex
        if: steps.stage.outputs.stage != ''
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            You are implementing stage ${{ steps.stage.outputs.stage }} of an OpenCode SDK v2 / OpenAI-compatible gateway.
            Scope: ${{ steps.stage.outputs.title }}.
            Read AGENTS.md and existing code. Implement the stage fully with meaningful automated tests.
            Use only opencode/muse-spark-1.3-contributor-free for any live E2E tests; never call paid model fallbacks.
            Preserve unrelated files. Do not edit GitHub workflows or secrets. Do not merge anything.
            Keep the default behavior safe: no untrusted shell/filesystem tools enabled.
            Ensure npm run typecheck, npm test and npm run build pass.
      - name: Verify generated implementation
        if: steps.stage.outputs.stage != ''
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Publish next draft PR
        if: steps.stage.outputs.stage != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ steps.stage.outputs.stage }}
          BRANCH: ${{ steps.stage.outputs.branch }}
          TITLE: ${{ steps.stage.outputs.title }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::Agent produced no repository changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "feat(stage-$STAGE): $TITLE"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --draft --base main --head "$BRANCH" --title "feat(stage $STAGE): $TITLE" --body "Automatically implemented after prior PR merge. CI must pass and the PR must be reviewed before merging. Live Muse Spark E2E was not run unless explicitly evidenced in CI logs."
