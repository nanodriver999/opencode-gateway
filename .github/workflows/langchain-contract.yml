name: Python LangChain client tool HTTP contract
on:
  pull_request:
    paths:
      - "scripts/mock-langchain-gateway.mjs"
      - "scripts/langchain-tool-contract.py"
      - ".github/workflows/langchain-contract.yml"
      - "src/openai/**"
      - "src/app.ts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  langchain-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: python -m pip install "langchain-openai>=0.3,<2"
      - name: Start mock-backed Gateway
        run: |
          node scripts/mock-langchain-gateway.mjs >"$RUNNER_TEMP/gateway.log" 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3099/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/gateway.log"
          exit 1
      - name: Exercise real LangChain bind_tools and ToolMessage
        run: python scripts/langchain-tool-contract.py
      - name: Diagnostics
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/gateway.log" || true
